# ============================================================
# Global Configuration — HRSS Recommendation System
# ============================================================

project:
  name: "HRSS Recommendation System"
  version: "1.0.0"
  random_seed: 42

paths:
  raw_data: "data/raw/"
  processed_data: "data/processed/"
  splits: "data/splits/"
  models: "models/"
  figures: "outputs/figures/"
  reports: "outputs/reports/"

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "hrss-production-training"

target:
  column: "operation_type"
  class_labels:
    0: "standard_operation"
    1: "optimized_operation"

training:
  model_type: "RandomForest"
  n_estimators: 100
  test_size: 0.2

feature_engineering:
  power_columns:
    - "O_w_BLO_power"
    - "O_w_BHL_power"
    - "O_w_BHR_power"
    - "O_w_BRU_power"
    - "O_w_HR_power"
    - "O_w_HL_power"
  voltage_columns:
    - "O_w_BLO_voltage"
    - "O_w_BHL_voltage"
    - "O_w_BHR_voltage"
    - "O_w_BRU_voltage"
    - "O_w_HR_voltage"
    - "O_w_HL_voltage"
  movement_columns:
    - "I_w_BLO_Weg"
    - "I_w_BHL_Weg"
    - "I_w_BHR_Weg"
    - "I_w_BRU_Weg"
    - "I_w_HR_Weg"
    - "I_w_HL_Weg"
  rail_columns:
    - "I_w_HR_Weg"
    - "I_w_HL_Weg"
  conveyor_columns:
    - "I_w_BLO_Weg"
    - "I_w_BHL_Weg"
    - "I_w_BHR_Weg"
