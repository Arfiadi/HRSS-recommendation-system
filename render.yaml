services:
  - type: web
    name: hrss-recommendation-api
    env: python
    buildCommand: pip install -e .[api]
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: ALLOWED_ORIGINS
        value: "*" # Anda bisa menggantinya ke URL Vercel yang spesifik nantinya demi keamanan
